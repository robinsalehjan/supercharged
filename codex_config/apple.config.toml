# Apple development profile. Start Codex with `codex -p apple` to layer these
# tools on top of the lean, general-development base configuration.
#
# XcodeBuildMCP build/test responses use their current structured-result schema;
# consumers must not assume legacy schema versions or an implicit Debug build.

[mcp_servers.XcodeBuildMCP]
command = "xcodebuildmcp"
args = ["mcp"]

[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
