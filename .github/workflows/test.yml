name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache Homebrew downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Library/Caches/Homebrew/downloads
          ~/Library/Caches/Homebrew/api
        key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/test.yml') }}
        restore-keys: |
          ${{ runner.os }}-brew-

    - name: Install test dependencies
      run: |
        set -euo pipefail
        # Only install what isn't already present on the runner image.
        # A transient Homebrew/network failure previously turned main red, so
        # each install gets a bounded retry before the job fails.
        for pkg in actionlint bats-core jq ripgrep shellcheck; do
          if brew list --formula --versions "$pkg" >/dev/null 2>&1; then
            continue
          fi
          for attempt in 1 2 3; do
            if brew install "$pkg"; then
              continue 2
            fi
            echo "brew install $pkg failed (attempt $attempt/3)"
            sleep $(( attempt * 10 ))
          done
          echo "::error::Failed to install $pkg after 3 attempts"
          exit 1
        done

    - name: Run shellcheck
      run: npm run lint

    - name: Run secret scan
      run: npm run scan:secrets

    - name: Audit tracked agent configuration
      run: npm run audit:agents -- --repo-only

    - name: Run BATS tests
      run: npm test

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-logs
        path: |
          tests/**/*.log
          *.log
